name = "yuzme-kulup-worker"
main = "index.js"
compatibility_date = "2026-11-01"

[vars]
FIREBASE_PROJECT_ID = "yuzme-kulup-sistemi"
CLOUDINARY_CLOUD_NAME = "aziqimvl"
GITHUB_REPOSITORY = "kanallarimpara-max/yuzme-kulup-sistemi"

[ai]
binding = "AI"

# Yeni yarışları yarım saatte bir arar, devam eden yarışı dakikada bir kontrol eder.
[triggers]
# Ayrıca her sabah 09:00 (Türkiye) taksit hatırlatması, her ayın 1'inde aylık rapor bildirimi gönderilir.
crons = ["* * * * *", "0 6 * * *", "0 6 1 * *"]
