name: Windows Uygulamasi

# Özel depoda aylık ücretsiz dakikayı korumak için yalnız elle veya sürüm etiketiyle çalışır.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run windows
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Uygulamayi gercekten ac
        run: |
          npm install --no-save playwright-core@1.49.1
          node scripts/windows-duman.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ekran
          path: duman/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: yuzme-kulup-windows
          path: release/*.exe
          retention-days: 14
