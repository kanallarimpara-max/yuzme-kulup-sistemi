name: TYF Sonuclari

# Her gün Türkiye saatiyle 07:00'de TYF "Yüzme / Sonuçlar" sayfasındaki yeni toplu sonuçları okur,
# kulüplerin sporcularının yarış derecelerini kendiliğinden kaydeder. Anahtar saklanmaz; kimlik GitHub'ın imzalı belgesidir.
on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tyf-sonuclari
  cancel-in-progress: false

jobs:
  aktar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/tyf-sonuclar.mjs
        env:
          WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - name: TYF sonuç önbelleğini al
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tyf-siralama
          key: rank-pdf-v1-${{ github.run_id }}
          restore-keys: rank-pdf-v1-
      - name: Türkiye sıralamalarını güncelle
        run: node scripts/tyf-siralama.mjs
        env:
          WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          RANK_CACHE_DIR: ${{ runner.temp }}/tyf-siralama
      - name: TYF sonuç önbelleğini sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tyf-siralama
          key: rank-pdf-v1-${{ github.run_id }}
